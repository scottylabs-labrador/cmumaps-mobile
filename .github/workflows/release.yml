name: Release

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Run the production workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bunx eas-cli workflow:run .eas/workflows/deploy-production.yml \
            --ref "$SHA" \
            --non-interactive \
            --wait
