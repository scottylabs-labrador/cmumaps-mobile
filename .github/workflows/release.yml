name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Run the production workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          bunx eas-cli workflow:run .eas/workflows/deploy-production.yml \
            --ref "$SHA" \
            --non-interactive \
            --wait
