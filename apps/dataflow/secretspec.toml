[project]
name = "dataflow"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml"]

[profiles.default]
S3_ACCESS_KEY = { description = "S3 access key", required = true }
S3_ENDPOINT = { description = "S3 endpoint host or URL", required = true }
S3_SECRET_KEY = { description = "S3 secret key", required = true }

[profiles.local]
S3_ACCESS_KEY = { ref = { item = "cmumaps-mobile/local/dataflow", field = "S3_ACCESS_KEY" } }
S3_ENDPOINT = { ref = { item = "cmumaps-mobile/local/dataflow", field = "S3_ENDPOINT" } }
S3_SECRET_KEY = { ref = { item = "cmumaps-mobile/local/dataflow", field = "S3_SECRET_KEY" } }
