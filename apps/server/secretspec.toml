[project]
name = "server"
revision = "1.0"
extends = ["../../secretspec.toml"]

[profiles.default]
ALLOWED_ORIGINS_REGEX = { description = "Allowed CORS origins regex", required = true }
AUTH_CLIENT_ID = { description = "Keycloak client ID", required = true }
AUTH_CLIENT_SECRET = { description = "Keycloak client secret", required = true }
AUTH_ISSUER = { description = "Keycloak issuer URL", required = true }
AUTH_JWKS_URI = { description = "Keycloak JWKS URI", required = true }
BETTER_AUTH_URL = { description = "Better Auth trusted origin URL", required = true }
SERVER_URL = { description = "Server URL", required = true }

[profiles.local]
ALLOWED_ORIGINS_REGEX = { default = '^https?://localhost(:\d+)?$', ref = { item = "cmumaps-mobile/local/server", field = "ALLOWED_ORIGINS_REGEX" } }
AUTH_CLIENT_ID = { ref = { item = "cmumaps-mobile/generated/local", field = "AUTH_CLIENT_ID" } }
AUTH_CLIENT_SECRET = { ref = { item = "cmumaps-mobile/generated/local", field = "AUTH_CLIENT_SECRET" } }
AUTH_ISSUER = { default = "https://idp.scottylabs.org/realms/labrador", ref = { item = "cmumaps-mobile/local/server", field = "AUTH_ISSUER" } }
AUTH_JWKS_URI = { default = "https://idp.scottylabs.org/realms/labrador/protocol/openid-connect/certs", ref = { item = "cmumaps-mobile/local/server", field = "AUTH_JWKS_URI" } }
BETTER_AUTH_URL = { default = "http://localhost:5173", ref = { item = "cmumaps-mobile/local/server", field = "BETTER_AUTH_URL" } }
SERVER_PORT = { description = "Server listen port", default = "8080" }
SERVER_URL = { default = "http://localhost:8080", ref = { item = "cmumaps-mobile/local/server", field = "SERVER_URL" } }
