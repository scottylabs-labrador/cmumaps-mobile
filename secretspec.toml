[project]
name = "cmumaps-mobile"
revision = "1.0"

[providers]
bao = "openbao://bao.scottylabs.org/labrador"

[profiles.default.defaults]
providers = ["bao"]

[profiles.default]
SERVER_URL = { description = "Server URL", required = true }

[profiles.local.defaults]
providers = ["bao"]

[profiles.local]
SERVER_URL = { default = "http://localhost:8080", ref = { item = "cmumaps-mobile/local/server", field = "SERVER_URL" } }
