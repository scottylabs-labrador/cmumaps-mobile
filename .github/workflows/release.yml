name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Metadata only, or validate GitHub builds without publishing"
        type: choice
        options: [metadata, validate]
        default: metadata
  push:
    branches: [main, feat/github-native-releases]

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      metadata: ${{ steps.changes.outputs.metadata }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bun scripts/mobile-release/changes.ts

  native:
    needs: changes
    if: inputs.mode == 'validate' || (github.event_name == 'push' && needs.changes.outputs.mobile == 'true')
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    uses: ./.github/workflows/mobile-native.yml
    with:
      platform: ${{ matrix.platform }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets: inherit
    permissions:
      contents: write
      actions: read

  store-metadata:
    name: Publish ${{ matrix.store }} metadata
    needs: changes
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'metadata' || (github.event_name == 'push' && needs.changes.outputs.metadata == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [android, ios]
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_HIDE_CHANGELOG: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: apps/mobile
          bundler-cache: true

      - name: Publish Google Play metadata
        if: matrix.store == 'android'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android metadata

      - name: Publish App Store metadata
        if: matrix.store == 'ios'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APP_REVIEW_PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
        run: bundle exec fastlane ios metadata
