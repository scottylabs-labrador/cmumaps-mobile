name: Mobile native release

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  platform:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      CI: "true"
      PLATFORM: ${{ inputs.platform }}
      RELEASE_MODE: ${{ inputs.publish && 'auto' || 'validate' }}
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      MOBILE_BUILD_NUMBER_BASE: ${{ vars.MOBILE_BUILD_NUMBER_BASE }}
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: apps/mobile
          bundler-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test release decisions
        run: bun test scripts/mobile-release
      - name: Pull production configuration
        if: inputs.publish
        working-directory: apps/mobile
        run: bunx eas-cli@27.11.0 env:pull production --path .env.local --non-interactive
      - name: Plan compatible release
        id: plan
        run: bun scripts/mobile-release/plan.ts
      - name: Export build number
        run: |
          echo "MOBILE_BUILD_NUMBER=${{ steps.plan.outputs.build_number || '1' }}" >> "$GITHUB_ENV"
          echo "MOBILE_RUNTIME_VERSION=${{ steps.plan.outputs.runtime }}" >> "$GITHUB_ENV"
      - name: Verify publication is current
        if: inputs.publish
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Require checks for this commit
        if: inputs.publish
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --json conclusion,status \
              --jq '.[0] | if .status == "completed" then .conclusion else "waiting" end')
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" != waiting ] && [ -n "$result" ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Select Xcode
        if: inputs.platform == 'ios' && steps.plan.outputs.action == 'build'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build native artifact
        if: steps.plan.outputs.action == 'build'
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane "$PLATFORM" build
      - name: Retain build artifact
        if: steps.plan.outputs.action == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ inputs.platform }}-${{ github.run_id }}
          path: apps/mobile/build/*
          retention-days: 7
          if-no-files-found: error
      - name: Upload binary to store
        if: inputs.publish && steps.plan.outputs.action == 'build'
        working-directory: apps/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: bundle exec fastlane "$PLATFORM" upload
      - name: Record successfully uploaded runtime
        if: inputs.publish && steps.plan.outputs.action == 'build'
        env:
          PUBLICATION_SUCCEEDED: "true"
          RELEASE_ACTION: ${{ steps.plan.outputs.action }}
          RELEASE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
          RELEASE_RUNTIME: ${{ steps.plan.outputs.runtime }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: bun scripts/mobile-release/state.ts
      - name: Publish compatible OTA update
        if: inputs.publish && steps.plan.outputs.action == 'update'
        working-directory: apps/mobile
        run: bunx eas-cli@27.11.0 update --branch production --platform "$PLATFORM" --environment production --message "$GITHUB_SHA" --non-interactive
      - name: Record successful OTA publication
        if: inputs.publish && steps.plan.outputs.action == 'update'
        env:
          PUBLICATION_SUCCEEDED: "true"
          RELEASE_ACTION: ${{ steps.plan.outputs.action }}
          RELEASE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
          RELEASE_RUNTIME: ${{ steps.plan.outputs.runtime }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: bun scripts/mobile-release/state.ts
