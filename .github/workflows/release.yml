name: Release

on:
  push:
    branches: [main]
  # Manual runs publish metadata only; EAS is never invoked.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Run the production workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          bunx eas-cli workflow:run .eas/workflows/deploy-production.yml \
            --ref "$SHA" \
            --non-interactive \
            --wait

  store-metadata:
    name: Publish ${{ matrix.store }} metadata
    needs: [release]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [android, ios]
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_HIDE_CHANGELOG: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: apps/mobile
          bundler-cache: true

      - name: Publish Google Play metadata
        if: matrix.store == 'android'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android metadata

      - name: Publish App Store metadata
        if: matrix.store == 'ios'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APP_REVIEW_PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
        run: bundle exec fastlane ios metadata
